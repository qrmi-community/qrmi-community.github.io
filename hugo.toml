baseURL = "https://qrmi-community.github.io/"
locale = "en-US"
title = "QRMI Community"
buildFuture = true
enableGitInfo = true
enableRobotsTXT = true

# Only the blog has a feed: it sets outputs: [html, rss] in its front matter.
[outputs]
home = ["html"]
section = ["html"]
taxonomy = ["html"]
term = ["html"]

[taxonomies]
author = "authors"

# Code is coloured by classes styled in assets/css/chroma/; maths is rendered to
# MathML at build time by layouts/_markup/render-passthrough.html.
[markup.highlight]
noClasses = false
lineNumbersInTable = false
[markup.goldmark.extensions.passthrough]
enable = true
[markup.goldmark.extensions.passthrough.delimiters]
block = [['\[', '\]'], ['$$', '$$']]
inline = [['\(', '\)'], ['$', '$']]

[frontmatter]
lastmod = [":git", "lastmod", ":fileModTime"]

[menu]
[[menu.main]]
name = "Ecosystem"
pageRef = "/ecosystem"
weight = 1
[[menu.main]]
name = "Tutorials"
pageRef = "/tutorials"
weight = 2
[[menu.main]]
name = "Papers"
